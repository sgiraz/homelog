# Render Blueprint — PUBLIC DEMO ONLY.
#
# This defines the always-on public demo of HomeLog (DEMO_MODE=true), running
# the prebuilt DockerHub image with a throwaway, hourly-reset dataset. It is NOT
# how you self-host HomeLog for real use — for that, use docker-compose.yml and
# DEPLOY-GUIDE.md. Keeping the demo independent is intentional.
#
# Verify field names against current Render Blueprint docs before relying on
# this — the dashboard steps in demo/README.md are an equivalent, more forgiving
# alternative if the Blueprint sync errors out.
services:
  - type: web
    name: homelog-demo
    runtime: image
    image:
      url: docker.io/sgira/homelog:latest
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: GIN_MODE
        value: release
      - key: TZ
        value: Europe/Rome
      # Render generates a strong random value once and keeps it stable across
      # deploys — no need to manage a JWT secret by hand.
      - key: JWT_SECRET
        generateValue: true
