name: Build and Push Docker Image

on:
  push:
    tags:
      # CalVer: 2026.03.01, 2026.03.01.1, and pre-releases 2026.03.01-rc.1
      - '[0-9][0-9][0-9][0-9].*'
  workflow_dispatch:

env:
  IMAGE: sgira/homelog

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version and image tags
        id: meta
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME}

          # workflow_dispatch can run from a branch, where GITHUB_REF_NAME is the
          # branch name — "main", not a version. Such a build must never claim
          # :latest, or a demo redeploy (and every `docker compose pull`) would
          # silently ship an untagged main build as the current release.
          #
          # A "-rc.N" tag is a release candidate: it gets its own immutable tag
          # plus the moving :rc pointer, and must never touch :latest either —
          # :latest is what self-hosters pull, and it has to stay the last
          # version that was actually released.
          IS_PRERELEASE=false
          IS_RELEASE=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${VERSION}" in
              *-rc.*) IS_PRERELEASE=true ;;
              *)      IS_RELEASE=true ;;
            esac
          fi

          {
            echo "version=${VERSION}"
            echo "is_release=${IS_RELEASE}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "tags<<TAGS_EOF"
            echo "${IMAGE}:${VERSION}"
            if [ "${IS_RELEASE}" = "true" ]; then echo "${IMAGE}:latest"; fi
            if [ "${IS_PRERELEASE}" = "true" ]; then echo "${IMAGE}:rc"; fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Building version: ${VERSION} (release: ${IS_RELEASE}, pre-release: ${IS_PRERELEASE})"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: linux/amd64, linux/arm64, linux/arm/v7" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.meta.outputs.is_release }}" = "true" ]; then
            echo "- Also tagged \`latest\`" >> $GITHUB_STEP_SUMMARY
            echo "- Announce it when ready via the **Publish GitHub Release** workflow" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            echo "- Also tagged \`rc\` — \`latest\` untouched, so no instance is told to upgrade" >> $GITHUB_STEP_SUMMARY
            echo "- Try it out, then publish it as a **pre-release** via the **Publish GitHub Release** workflow" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Not a tag build: \`latest\` was skipped" >> $GITHUB_STEP_SUMMARY
          fi
