version: '3.8'

services:
  homelog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelog
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - DB_PATH=/app/data/homelog.db
      - JWT_SECRET=${JWT_SECRET}
      - TZ=Europe/Rome
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    driver: local
