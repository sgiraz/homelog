root = "."
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -gcflags='all=-N -l' -o /tmp/air/main ./cmd/api/"
  entrypoint = "dlv"
  args_bin = ["exec", "--accept-multiclient", "--continue", "--headless", "--listen=:2345", "--api-version=2", "--log", "/tmp/air/main"]
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "data"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
